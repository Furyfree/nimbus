# Paper Dark boot appearance: the GRUB menu and the Plymouth splash,
# including the native disk-unlock prompt. The engine package owns the theme
# payload and the inert /etc/grub.d/36_paper_dark drop-in; this component owns
# only the /etc/nimbus marker and the native refresh triggers. The Plymouth
# trigger hangs on the marker so removing the component restores the theme
# observed before install. It only selects the theme; initramfs-rebuild puts
# it into every installed kernel's image, not just the running one.
schema = 1
id = "boot-theme"

requires = []
conflicts = []

packages = [
  "grub2-tools",
  "plymouth-plugin-script",
  "plymouth-plugin-label",
  "dejavu-sans-mono-fonts",
]

removes = []

[[files]]
source = "etc/nimbus/boot-theme.enabled"
owner = "root"
group = "root"
mode = "0644"
triggers = ["grub-config", "plymouth-theme", "initramfs-rebuild"]
