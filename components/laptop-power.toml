# Laptop display, power, battery, and fingerprint reader.
schema = 1
id = "laptop-power"

requires = []
conflicts = []
packages = [
  "brightnessctl",
  "power-profiles-daemon",
  "upower",
  "fprintd",
]
removes = []

[detect]
chassis = "laptop"

[[services]]
unit = "power-profiles-daemon.service"
enabled = true
running = true
