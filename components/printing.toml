# Native network printing and scanning, including the Epson ET-5800.
schema = 1
id = "printing"

requires = []
conflicts = []
packages = [
  "cups",
  "avahi",
  "ghostscript",
  "sane-airscan",
  "simple-scan",
]
removes = []

[[services]]
unit = "cups.socket"
enabled = true
running = true

[[services]]
unit = "cups.path"
enabled = true
running = true

[[services]]
unit = "avahi-daemon.service"
enabled = true
running = true
