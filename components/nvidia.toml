# NVIDIA driver from RPM Fusion with Secure Boot module signing support.
# MOK enrollment is a manual task that arrives with the task model.
schema = 1
id = "nvidia"

requires = []
conflicts = []
packages = [
  "rpmfusion-nonfree:akmod-nvidia",
  "rpmfusion-nonfree:xorg-x11-drv-nvidia-cuda",
  "rpmfusion-nonfree:xorg-x11-drv-nvidia-libs.i686",
  "libva-nvidia-driver",
  "akmods",
  "mokutil",
]
removes = []

# Mask RPM Fusion's X11 settings-loader autostart for the Wayland workstation.
# systemd treats an empty unit file as masked. Keep this source zero bytes.
# This system-wide user-unit policy takes effect at the next login.
[[files]]
source = 'etc/systemd/user/app-nvidia\x2dsettings\x2duser@autostart.service'
owner = "root"
group = "root"
mode = "0644"

[detect]
display_vendor = "10de"
