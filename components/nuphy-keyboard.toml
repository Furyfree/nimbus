# NuPhy keyboards: let NuPhy IO (drive.nuphy.io) remap and update them in a
# Chromium browser. uaccess must sort before systemd's 73-seat-late.rules.
# https://docs.qmk.fm/faq_build#linux-udev-rules
# Replug the keyboard after apply; reload does not re-run rules for it.
schema = 1
id = "nuphy-keyboard"

[[files]]
source = "etc/udev/rules.d/70-nimbus-nuphy.rules"
owner = "root"
group = "root"
mode = "0644"
triggers = ["udev-reload"]
