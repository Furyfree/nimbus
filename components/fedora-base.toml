# The Fedora base the installer leaves behind, so nothing Fedora installs is
# a prune candidate. Selected by common.
#
# The first list is the mandatory and default packages of the comps groups
# "core" and "standard" that INSTALLATION.md selects, generated from
# `dnf5 group info core standard` on Fedora 44 in the research container.
# The second is what Anaconda installs outside comps for the UEFI layout:
# kernel, firmware, bootloader, and release packages. Regenerate both per
# Fedora release; the first VM run in Phase 4 completes the second list from
# the real prune output.
schema = 1
id = "fedora-base"

