# Hyprland from its COPR, Noctalia from Fedora, the greeter from Terra, and
# the portals, audio, and session helpers they need.
schema = 1
id = "hyprland-session"
greeter_passwordless_sync = true

requires = ["hyprland-plugin-build"]
conflicts = []
packages = [
  "hyprland-copr:hyprland",
  "hyprland-copr:hyprland-uwsm",
  "hyprland-copr:hyprland-guiutils",
  "hyprland-copr:xdg-desktop-portal-hyprland",
  "noctalia",
  "terra:noctalia-greeter",
  "greetd",
  "xdg-desktop-portal-gtk",
  "xorg-x11-server-Xwayland",
  "qt6-qtwayland",
  "qt5-qtwayland",
  "xdg-utils",
  "xdg-user-dirs",
  "xdg-terminal-exec",
  "gnome-keyring",
  "gnome-keyring-pam",
  "accountsservice",
  "udiskie",
  "udisks2",
  "playerctl",
  "pipewire",
  "pipewire-pulseaudio",
  "pipewire-alsa",
  "wireplumber",
  "bluez",
  "terra:ghostty",
]
removes = ["foot", "kitty", "nwg-panel"]
default_target = "graphical.target"

# Enable for the next boot; do not interrupt an active graphical session.
[[services]]
unit = "greetd.service"
enabled = true

[[services]]
unit = "bluetooth.service"
enabled = true

# greetd auto-login starts UWSM, which waits for graphical.target before it
# starts Hyprland. docker.service and rsyslog.service order that target behind
# network-online.target, so the desktop waited for the Ethernet link and DHCP
# (14 s measured on the desktop). Nothing here needs the network at boot.
[[services]]
unit = "NetworkManager-wait-online.service"
enabled = false

[[files]]
source = "etc/greetd/nimbus.toml"
owner = "root"
group = "root"
mode = "0644"

[[files]]
source = "etc/systemd/system/greetd.service.d/nimbus.conf"
owner = "root"
group = "root"
mode = "0644"
triggers = ["systemd-daemon-reload"]

[[files]]
source = "etc/tmpfiles.d/nimbus-noctalia-greeter.conf"
owner = "root"
group = "root"
mode = "0644"
triggers = ["noctalia-state-directory"]

[[files]]
source = "etc/xdg/xdg-desktop-portal/hyprland-portals.conf"
owner = "root"
group = "root"
mode = "0644"

[[files]]
source = "etc/noctalia/greeter.toml"
owner = "root"
group = "root"
mode = "0644"
