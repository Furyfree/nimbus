[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/nimbus.toml
# Expose the managed configuration at the greeter's required path.
# Only this file is mounted; Noctalia's mutable sync state stays writable.
BindReadOnlyPaths=/etc/noctalia/greeter.toml:/var/lib/noctalia-greeter/greeter.toml
