# Nimbus owns this file through the nvidia-boot-display component.
#
# Plymouth must only see the GPU that has the monitor. On this desktop the
# monitor hangs on the NVIDIA card, whose driver RPM Fusion keeps out of the
# initramfs, while the Intel iGPU drives nothing. With an Intel driver in the
# initramfs Plymouth binds the iGPU: the unlock prompt is invisible or takes
# no keyboard input. Without one, Plymouth draws on the firmware framebuffer
# of the NVIDIA-connected monitor after its DeviceTimeout. i915 and xe load
# from the root filesystem after unlock, so the iGPU keeps working.
#
# nouveau is omitted as dead weight: the kernel command line blacklists it
# while the NVIDIA driver is installed, yet it drags about 100 MB of GSP
# firmware into every initramfs that GRUB has to load.
omit_drivers+=" i915 xe nouveau "
