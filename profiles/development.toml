# Developer applications, Docker, and Nix. Common setup provides Mise and
# build prerequisites; Chezmoi owns the runtime and Cargo tool configuration.
schema = 1
id = "development"

packages = [
  "vscodium:codium",
  "terra:t3code",
  "chatgpt:chatgpt",
  "claude-desktop-installer:claude-desktop-installer",
  "woeusb:woeusb",
]

components = [
  "zed",
  "zeron",
  "docker",
  "nix",
  "fedora-iso",
  "copr",
]
