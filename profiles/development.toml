# Developer tooling, Docker, Nix, Mise with its runtimes, and the Cargo tools
# built with the Rust runtime Mise provides.
schema = 1
id = "development"

packages = [
  "gcc",
  "gcc-c++",
  "clang",
  "cmake",
  "ninja-build",
  "vscodium:codium",
  "terra:t3code",
  "chatgpt:chatgpt",
  "cargo:caligula",
  "cargo:typst-cli",
  "cargo:tinymist",
  "cargo:cargo-update",
  "cargo:sheldon",
  "cargo:resvg",
  "cargo:vm-curator",
]

components = [
  "docker",
  "nix",
  "mise",
]
