# Nimbus definition root. See docs/SPEC.md, "Configuration model".
schema = 1

[compatibility]
fedora = ["44"]
min_engine = "0.1.0"

# Repositories other than Fedora. The table key is the prefix a package
# reference uses. `key` is the fingerprint the signing key must have, and
# `priority` is above Fedora's default 99 so Fedora wins a shared name.

# libdnf5 [main] options, written to /etc/dnf/libdnf5.conf.d/20-nimbus.conf
# before the first package transaction. Defaults: 3 parallel downloads, no
# mirror latency test, prompts default to No.
[dnf]
max_parallel_downloads = 20
fastestmirror = true
defaultyes = true

[repositories.terra]
kind = "dnf"
baseurl = "https://repos.fyralabs.com/terra$releasever"
key_url = "https://repos.fyralabs.com/terra44/key.asc"
key = "AE09 157A 4DE8 8B49 7EA1 D5D3 00CD AB43 DE22 6D6F"
priority = 110

